# Single-service deployment: everything (web + API + storage + worker) runs in
# one container. Postgres is an external Neon database; the only extra resource
# is a managed Redis instance used by the deck-processing queue.
services:
  - type: web
    name: ke-pitch-all
    runtime: image
    repo: https://github.com/lyhengdev/slide-preview
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: ke-pitch-cache
          type: redis
          property: connectionString
      - key: STORAGE_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
    image:
      path: ./Dockerfile.all

  - type: redis
    name: ke-pitch-cache
    plan: starter
    maxmemoryPolicy: noeviction