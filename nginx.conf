server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The separate ke-pitch-api service serves /api and Socket.IO.
  # In production the web app calls the API host directly via VITE_API_URL,
  # so no reverse proxy is needed here.
}